scope: >
  Tacit failure modes specific to modelling phosphorylation-based intracellular signalling on the minutes-to
  -hours timescale: conserved protein pools across phospho-states, basal phosphatase activity and what
  starvation does to it, timescale separation between signalling and expression, dose entering through
  receptor occupancy, and antibody specificity. Assumes the measurement layer for assay mechanics. Does not
  cover metabolism, gene-regulatory dynamics or epidemiological compartment models.
