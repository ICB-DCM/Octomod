# Frozen S0 intent for ctd_blind. Written at staging time and never edited by an
# agent — the success criteria in particular are what the agent is judged
# against, so it may not choose them.
#
# THE FIRST CASE WITH REAL DATA AND A PUBLISHED ANSWER.
#
# Data: Czudnochowski, Bösken & Geyer (2012), Nat Commun, doi 10.1038/ncomms1846
#       — a public dataset, NOT generated by this group.
# Answer: Callenbach, Dorešić, Düster, Nakonecnij, Dudkin, Geyer & Hasenauer,
#       PLOS Comput Biol, doi 10.1371/journal.pcbi.1014531 — the modelling paper
#       whose conclusion `truth/` records.
#
# WHAT MAKES THIS DIFFERENT FROM abcd_*: the answer was peer-reviewed and argued
# over by three people, not invented by us. And unlike an invented truth, part of
# it is a NEGATIVE: the paper states that one hypothesis cannot be settled by
# these data. A pipeline that claims to settle it is wrong even if it picks the
# published winner.
#
# CONTAMINATION, stated plainly:
#  · A cold-knowledge probe was run before staging (2026-09-10, no web, no file
#    access): the model has NO specific knowledge of this paper and NO specific
#    knowledge of the group's work on it.
#    It DID commit to a mechanism from general literature knowledge. Whether that
#    guess coincides with the published answer is for a human to check — if it does,
#    a correct result here is weakly evidenced and the case must be re-framed or
#    the system anonymised.
#  · description.md was written from the METHODS only. Its provenance, sentence by
#    sentence, is in truth/DESCRIPTION-PROVENANCE.md. This case NAMES two of the
#    candidate mechanisms as hypotheses to test — a neighbour (local) effect and
#    cooperativity between repeats — because that is what the experimenters had
#    in mind going in (truth/STAGED-ON-PURPOSE.txt declares both). The word
#    "directional" and every result of the paper are absent by construction.
#  · What description.md DOES carry is prior literature that predates the paper:
#    that earlier work concluded distributive rather than processive from visual
#    inspection. That is what an experimenter would have believed going in, so
#    withholding it would make the note dishonest rather than blind. It is
#    recorded here as a deliberate choice, not an oversight.

question: >-
  Build a model of this CTD phosphorylation time course that explains the measured
  distributions, and say what it implies about how P-TEFb modifies the substrate.
  Report explicitly what these data can and cannot establish about the mechanism.
  In particular, test whether the modification of a repeat changes the rate at which
  its immediate neighbours in the array are modified, against the alternatives that
  the rate depends only on how many repeats are already modified (cooperativity
  between repeats) or on nothing at all, and say which of these the data can and
  cannot separate.

system: >-
  RNA polymerase II CTD (8 heptarepeats, in vitro), phosphorylated by P-TEFb
  (CDK9/cyclin T1); mass-spectrometry time course

required_entities:
  - the CTD substrate, resolved by number of phosphorylated repeats
  - the kinase P-TEFb
  - ATP

required_predictions:
  # phrased as a task, not an answer: what must be DELIVERED, with no candidate
  # mechanism named
  - the mechanism of phosphorylation that best explains the measured distributions,
    identified and defended
  - a statement of which mechanistic questions these data cannot answer

perturbations:
  - none — a single in vitro condition, sampled over time

timescale: minutes, horizon 960 min (16 h)

scope_exclusions:
  - transcription, DNA and the polymerase itself — this is a purified in vitro assay
  - the distinction between Ser2 and Ser5 within a repeat (established as mutually
    exclusive under these conditions; each repeat is one bit)

success_criteria:
  - the selected mechanism is reported with its information criterion, its Akaike
    weight and the indistinguishable set, honestly, whatever they turn out to be
  - the observation model is stated explicitly, including how predicted amounts are
    mapped onto relative MS intensities at each time point
  - any mechanistic question the data cannot resolve is named as unresolved rather
    than decided

inference_target: mechanism_discrimination

domain_packs:
  - general-dynamics
  - measurement-tech
