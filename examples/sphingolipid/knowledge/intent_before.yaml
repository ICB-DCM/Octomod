# S0 intent for sphingolipid_metabolism (clean restart). Drafted with the user
# 2026-09-28; the success criteria are the user's.
#
# inference_target is parameter_values on purpose: under this target the engine
# compares structural alternatives (open axes) on the base model, one at a time,
# and can expand the model space after a selection round. Under
# mechanism_discrimination it accepts only whole candidate models.

question: >-
  We have a model of sphingolipid metabolism that was constructed by hand. This
  model can be improved upon: some reactions might be too detailed, some included
  pools might not really serve sphingolipid metabolism itself, or reactions might
  be missing. The main goal is a biologically plausible mechanistic model of
  sphingolipid metabolism on which further research can be built. Starting from
  the user's base model, which structure do the two-tracer pulse-chase data and
  the sphingolipid literature support, and what are its rate constants?

system: >-
  Sphingolipid metabolism in human neuroblastoma SH-SY5Y cells under basal
  conditions, followed by click-MS lipidomics after a 60 min pulse with 1 uM
  alkyne sphinganine and 50 uM 13C6-alkyne palmitate and a 180 min chase; base
  model of 14 species and 21 irreversible mass-action reactions, both tracers
  summed as one label

required_entities:
  - Sph
  - DhCer
  - Cer
  - SM
  - HexCer
  - FFA

required_predictions:
  - for each structural alternative tested, whether the data support it, with the
    criterion difference and weight behind that call
  - the set of structures the data cannot tell apart, stated explicitly
  - point estimates with confidence intervals for the rate constants of the
    selected structure
  - the fitted time courses of all eleven fitted lipid pools over the 180 min chase
  - for each fitted pool outside the sphingolipid pathway (FFA, PC, DG, CE), whether
    it constrains the sphingolipid part of the selected model, as the basis for the
    user's decision between runs on which pools to keep

perturbations:
  - none; a single basal pulse-chase condition, t = 0 is the end of the 60 min pulse

timescale: minutes, horizon 180 min

scope_exclusions:
  - separating the two tracers, deferred to a later stage
  - the measured classes TG, PA, PE, PI and MG, left out of the model by the user
  - removing a fitted pool from the data, which the user decides between runs

success_criteria:
  - every reaction in the final model is either required by the data (removing it
    clearly worsens the criterion) or backed by a cited source, and every reaction
    removed from the user's base model is named with the reason for removing it
  - where several reaction steps known from the literature are collapsed into a
    single reaction for the sake of identifiability, this is stated for that
    reaction
  - the final model fits every sphingolipid pool (Sph, DhCer, Cer, SM, HexCer)
    without systematic misfit, or the pool it misses is named
  - every rate constant of the final model is reported with an interval, and any
    the data do not bound is named as such
  - structures the data cannot tell apart are listed, not forced into a single
    winner
  - convergence of the multistart is evidenced for every model compared

inference_target: parameter_values

domain_packs:
  - general-dynamics
  - measurement-tech
