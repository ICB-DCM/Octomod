name: ctd_blind_local_v3

# Last sampled time; the S1 gate ladder simulates to here.
t_end: 960

# NO HOLDOUT, and the reason is structural rather than a preference. There is one
# condition and four time points. Holding out a time point would remove one of the
# four scaling factors from the fit, so the held-out prediction would test an
# unidentified observation parameter rather than the mechanism. The engine reports
# this honestly: with no holdout, discrimination rests on information criteria
# alone (`holdout.available: false`).
holdout:
  condition_labels: []

# No supplied model or network: construction is unconstrained and must be derived
# from description.md alone.
supplied: {}

notes: >-
  V3, EDITED AFTER RUN r1 (2026-10-03, owner's decision): description.md's error
  sentence reworded, same structure — "of the same size for every peak within one
  spectrum" became "with a single standard deviation for the whole experiment — the
  same for every peak". In ctd_blind_local_v3_r1_20261003_200336 the observation-model
  agent read the old wording as one sigma it believed it could not share across the
  nine observables, estimated nine per-peak sigmas, and the fit discarded the 8p peak
  (FAILURES.md 2026-10-03). And one sentence appended to "What can be computed
  here": a possibility that only a description tracking which repeats are modified
  can represent should be fitted, not settled by argument from the counts. In r1
  construction chose nine count states, judged the 256-state model exact for the
  neighbour hypothesis but unidentifiable, and asked the person whether to build it
  (user_decision_required); under the policy nobody answered. The sentence is that
  answer, as a standing preference, naming no hypothesis. r1's record holds the
  earlier text; runs after it read this one.

  EDITED AGAIN AFTER RUN r2 (2026-10-04, owner's decision): one more sentence in
  "What can be computed here" — such a model can be written out in full, every state
  and every reaction listed one by one, and we would rather it were written out than
  avoided. In ctd_blind_local_v3_r2_20261003_224023 construction wanted the
  positional model, judged 256 species and 1024 reactions unwritable by hand ("no
  code execution in this role"), and built counts with an explicit kinase; the
  neighbour hypothesis had no candidate. The sentence removes that belief and names
  no grouping, no symmetry and no hypothesis. r2's record holds the previous text.

  EDITED AFTER RUN r3 (2026-10-04, owner's decision): one technical sentence in "What
  can be computed here" — the simulator reserves x, k, p, y, w, h and t as names. In
  ctd_blind_local_v3_r3_20261004_005027 construction named the processivity
  parameter `p`; AMICI's importer renames a reserved symbol to `amici_p` while the
  PEtab parameter table keeps `p`, and every candidate was dropped at compile with
  KeyError: 'amici_p' (outcome stopped, $7.66). Put in the note, not the construction
  contract, because the workflow is frozen for the paper. r3 ran on the text above
  without it (and with uncommitted edits: dirty true).

  V3 (2026-10-03, owner's decision): v2 plus the processive check in the question —
  one sentence appended to intent.yaml's `question` and one to description.md's "The
  question" — so that "distributive" in the result is tested and not assumed; and
  intent.yaml's `required_entities` replaced by short names (CTD, P-TEFb, ATP). The
  old first entry, "the CTD substrate, resolved by number of phosphorylated
  repeats", described the readout and leaned construction toward a count-resolved
  state space; in v1 and v2 it and "the kinase P-TEFb" never matched a species or
  glossary entry, so it checked nothing. How finely to resolve the CTD is left to
  construction ("What can be computed here"). Nothing else changed.

  V2 (2026-09-29, owner's decision): identical to ctd_blind_local except ONE sentence
  of description.md, the error model. v1 carried only the paper's justification
  ("scale with the signal rather than being constant in absolute terms"); every CTD
  blind run read it per peak and built sigma_abs + sigma_rel * prediction, whose
  likelihood has no maximum on these exact zeros (FAILURES.md 2026-09-29). v2 states
  the structure the paper's methods give: additive Gaussian, one sd per time point
  shared by the nine peaks, scaled with that injection's gain. Nothing else changed;
  truth/ is not copied (the owner copies it in for scoring).

  REAL DATA, PUBLISHED ANSWER. The measurements are Czudnochowski et al. (2012),
  Nat Commun, doi 10.1038/ncomms1846 — 36 numbers, nine phosphorylation counts at
  four time points, one in vitro condition. They were NOT generated for this
  benchmark and were not generated by this group. `truth/` records the conclusion
  of Callenbach et al., PLOS Comput Biol, doi 10.1371/journal.pcbi.1014531, and
  MUST NEVER be staged into agent context.

  WHAT THIS CASE EXERCISES THAT NOTHING ELSE DOES:

    a real observation model      relative MS intensities with a per-time-point
                                  scaling factor and noise proportional to signal.
                                  The nine fractions sum to 1.00 / 4.07 / 3.79 /
                                  0.85 across the four time points, so a model that
                                  ignores the scaling cannot fit at all. This is
                                  the `mode: factor` shape (scaling, no offset) that
                                  IMPLEMENTATION-STATUS records as the least-tested
                                  cell of the hierarchical matrix.
    combinatorial state space     8 binary repeats = 256 configurations, observed
                                  only through their 9 sums. Every candidate is a
                                  256-state ODE unless the agent finds the reduction.
    NO REPLICATES                 one measurement per point. The model-free replicate
                                  noise floor — which the whole misfit apparatus is
                                  calibrated against — is UNAVAILABLE here, and every
                                  indicator falls back to its weaker form. That is a
                                  finding waiting to happen and it is why this case is
                                  worth running even if the mechanism comes out wrong.
    an answer with a NEGATIVE     the published conclusion includes a question the
                                  data cannot settle. Claiming to settle it is a
                                  failure mode that no invented benchmark has tested.

  WHY NO HOLDOUT: see the `holdout` block above — one condition, four time points,
  and one scaling factor per time point, so holding one out tests an unidentified
  observation parameter rather than the mechanism.

  A GUIDED VARIANT IS ONE FILE AWAY. As with abcd_prediction vs abcd_blind, a
  second case sharing this data with a description.md that names the candidate
  mechanisms would test "can it settle a stated question" instead of "can it find
  the question". Not staged; noted so the option is visible.

# A benchmark with ground truth: it runs without the knowledge module,
# so nothing the module could find reaches the blind run.
grounding:
  skip: true
  why: benchmark
