# Intent for staging/macrophage_xue — DRAFT 2026-09-29, written from the case
# owner's notes (xue_macrophage_ode_modelling_notes.md) for their sign-off.
# Frozen at the intent gate (S0). The success criteria are what the run is
# judged against and are never edited by an agent.

question: >-
  Can one shared transcriptional activity driven by IFN-γ, together with
  gene-specific basal production, activity-dependent production and
  first-order mRNA degradation, explain the IRF1, SOCS1, CXCL9 and CXCL10
  time courses of GM-CSF-differentiated human macrophages over 0.5–72 h, or
  is an attenuation of that activity needed, and does a single inhibitory
  feedback variable (for instance one produced from the SOCS1 transcript)
  account for it? Which of the activation, turnover and feedback rates can
  these arrays actually pin down?

system: >-
  Human monocyte-derived macrophages (CD14+ monocytes, 3 days GM-CSF),
  activated with IFN-γ 200 IU/ml; population-average transcript levels by
  Illumina HT-12 V3 arrays (GEO GSE46903, Xue et al. 2014). Effective
  transcription model: one unobserved IFN-γ-driven activity and four mRNAs.

required_entities:
  - A             # the effective IFN-γ-driven transcriptional activity (unobserved)
  - IRF1_mRNA
  - SOCS1_mRNA
  - CXCL9_mRNA
  - CXCL10_mRNA

required_predictions:
  - the four transcript time courses under IFN-γ (0.5–72 h) on the log2 array scale, per donor series
  - the time-matched untreated (control) time courses
  - whether the activity is attenuated, and the attenuation timescale against the transcripts' degradation timescales

perturbations:
  - IFN-γ 200 IU/ml added at t = 0 and assumed to stay in the medium (continuous stimulus; working assumption, open to revision); arrays at 0.5, 1, 2, 4, 6, 12, 24, 72 h (stimulus = IFNg)
  - untreated controls (stimulus = control), arrays at 0, 6, 12, 24, 48, 72 h

timescale: hours; first sample 0.5 h, last 72 h; horizon 72 h

scope_exclusions:
  - receptor binding, JAK/STAT phosphorylation, nuclear transport, or any explicitly measured STAT1 species
  - single-cell state switching or M1/M2 population fractions
  - other stimuli, other differentiation protocols, the ChIP-seq data
  - raw array reprocessing; any second log transform or per-time-point normalisation of the values
  - freely estimated Hill exponents
  - a detection-threshold or censoring term in the noise model
  - donor-specific kinetic parameters (donors may differ at most in baseline or scaling)

success_criteria:
  - the no-feedback base (shared activity; per transcript a basal rate, an activity-dependent rate and a degradation rate) and each alternative are compared by information criteria on all 81 arrays; a winner is reported with Akaike weight >= 0.7, otherwise the indistinguishable set is reported as such
  - the selected model reproduces each of the four IFN-γ time courses within the donor-to-donor scatter, with no systematic time-dependent residual for any transcript
  - the untreated time courses are reproduced by the basal terms and the initial state, without attributing their movement to stimulation-induced feedback
  - if attenuation is selected, its timescale and the four degradation rates are reported with profile-likelihood intervals; every rate the arrays cannot resolve is named as such
  - kinetic parameters are shared across donors; any donor-specific baseline or scaling parameter is declared and counted against the model

inference_target: mechanism_discrimination

domain_packs:
  - general-dynamics
  - measurement-tech

# From the notes' equation dm_j/dt = b_j + v_j H_j(A) - delta_j m_j: each
# transcript is produced (basal plus activity-dependent, A as modifier) and
# lost by first-order degradation. A required reaction enters the model
# whatever the literature says and is exempt from the support floor. The
# activity's own activation and loss are NOT listed on purpose: the notes
# leave its form open ("constrain or eliminate its timescale if the data
# cannot resolve it").
required_reactions:
  - {equation: "-> IRF1_mRNA",   modifiers: [A], note: "basal + A-dependent production, linear or simple saturating in A, no free Hill exponent"}
  - {equation: "IRF1_mRNA ->",   note: "first-order degradation"}
  - {equation: "-> SOCS1_mRNA",  modifiers: [A], note: "basal + A-dependent production, linear or simple saturating in A, no free Hill exponent"}
  - {equation: "SOCS1_mRNA ->",  note: "first-order degradation"}
  - {equation: "-> CXCL9_mRNA",  modifiers: [A], note: "basal + A-dependent production, linear or simple saturating in A, no free Hill exponent"}
  - {equation: "CXCL9_mRNA ->",  note: "first-order degradation"}
  - {equation: "-> CXCL10_mRNA", modifiers: [A], note: "basal + A-dependent production, linear or simple saturating in A, no free Hill exponent"}
  - {equation: "CXCL10_mRNA ->", note: "first-order degradation"}

